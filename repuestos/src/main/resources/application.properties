

# Servidor y Aplicación
server.port=8080
spring.application.name=repuestos
# Conexión a PostgreSQL (Asegúrate de tener creada la BD 'repuestos_db')
spring.datasource.url=jdbc:postgresql://localhost:5432/tecniya_db
spring.datasource.username=tecniya_user
spring.datasource.password=tecniya09*
spring.datasource.driver-class-name=org.postgresql.Driver

# AUTO-CREACIÓN DE TABLAS DESDE CLASES JAVA (Hibernate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Optimización del Pool de Conexiones HikariCP para la Orange Pi
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2